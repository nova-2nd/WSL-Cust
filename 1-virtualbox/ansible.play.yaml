---
- hosts: localhost
  become: yes
  tasks:
  - name: Add Oracle repo key
    apt_key:
      url: https://www.virtualbox.org/download/oracle_vbox_2016.asc
      state: present
  - name: Add Oracle repo key
    apt_key:
      url: https://www.virtualbox.org/download/oracle_vbox.asc
      state: present
  - name: Add Virtualbox repo
    apt_repository:
      repo: 'deb [arch=amd64] http://download.virtualbox.org/virtualbox/debian bullseye contrib' 
      state: present 
      filename: virtualbox
  - name: Update packages
    apt:
      name: "*"
      state: latest
      update_cache: yes
  - name: Install packages
    apt:
      name:
      - git
      - virtualbox-6.1
      - autoconf
      - flex
      - bison
      - build-essential
      - libelf-dev
      - libncurses-dev
      - libssl-dev
      - libtool
      - libudev-dev
      - bc
      - dwarves
  - name: Get WSL kernel source
    ansible.builtin.git:
      repo: 'https://github.com/microsoft/WSL2-Linux-Kernel.git'
      dest: /usr/src/5.15.57.1-microsoft-standard-WSL2
      version: linux-msft-wsl-5.15.57.1
      force: yes
  - name: Create kernel source folder in /lib/modules
    ansible.builtin.file:
      path: /lib/modules/5.15.57.1-microsoft-standard-WSL2
      state: directory
  - name: Create WSL kernel source symlinks
    ansible.builtin.file:
      src: "/usr/src/5.15.57.1-microsoft-standard-WSL2"
      dest: "/lib/modules/5.15.57.1-microsoft-standard-WSL2/source"
      state: link
  - name: Create WSL kernel source symlinks
    ansible.builtin.file:
      src: "/usr/src/5.15.57.1-microsoft-standard-WSL2"
      dest: "/lib/modules/5.15.57.1-microsoft-standard-WSL2/build"
      state: link
  - name: Touching module.builtin
    ansible.builtin.file:
      path: /lib/modules/5.15.57.1-microsoft-standard-WSL2/modules.builtin
      state: touch
  - name: Touching module.order
    ansible.builtin.file:
      path: /lib/modules/5.15.57.1-microsoft-standard-WSL2/modules.order
      state: touch
